
syntax = "proto3";
option go_package = "mutual_exclusion/grpc/mutual_exclusion";

message Nothing {}

message ChatMessage {
    uint64 id = 1;
    bool isRequest = 2;
    bool hasDisconnected = 3;
    uint64 timestamp = 4;
}

service ChatService {
    rpc ChatStream(stream ChatMessage) returns (stream ChatMessage);
}
